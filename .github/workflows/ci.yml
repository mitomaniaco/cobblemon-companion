name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Biome (lint e formatação)
        run: npm run lint
      - name: Knip (arquivos e dependências não usados)
        run: npm run knip
      - name: dependency-cruiser (contratos de arquitetura)
        run: npm run arch
      - name: Commitlint (título do PR e commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$PR_TITLE" | npx commitlint
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - name: Typecheck
        run: npm run typecheck
      - name: Testes com cobertura
        run: |
          npm run test:coverage 2>&1 | tee coverage.log
          { echo '### Cobertura (Vitest)'; echo '```'; sed -n '/Coverage summary/,$p' coverage.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Enviar cobertura ao Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
      - name: Build
        run: npm run build
