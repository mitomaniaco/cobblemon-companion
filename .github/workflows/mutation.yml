name: Mutação (Stryker)

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/domain/**'
      - 'src/app/trainer-session-model.ts'
      - 'src/features/damage/model.ts'
      - 'test/**'
      - 'stryker.config.json'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stryker
        run: npm run test:mutation
      - name: Relatório de mutação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore
